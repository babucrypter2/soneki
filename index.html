<style>
:root{
  --bg:#030712; --card:#111827; --card2:#1f2937; --line:#1f2937; --line2:#374151;
  --txt:#f9fafb; --sub:#6b7280; --hov:rgba(255,255,255,.04);
  --green:#10b981; --red:#f43f5e; --orange:#f97316; --violet:#a78bfa; --amber:#f59e0b; --blue:#60a5fa;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
body.light{
  --bg:#f3f4f6; --card:#ffffff; --card2:#f9fafb; --line:#e5e7eb; --line2:#d1d5db;
  --txt:#111827; --sub:#9ca3af; --hov:rgba(0,0,0,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-bottom:calc(78px + var(--safe-b));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#6b7280}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=date]{color-scheme:dark;font-size:13px;padding:7px 10px}
body.light input[type=date]{color-scheme:light}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}
a{color:var(--blue)}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 10px) 16px 2px}
.brandrow h1{margin:0;font-size:15.5px;font-weight:700;line-height:1.2}
.brandrow p{margin:1px 0 0;font-size:12.5px;color:var(--sub)}
.yearbar{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.ybtn{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--sub)}
.ybtn:active{background:var(--hov)}
.yearbar b{font-size:14.5px;font-weight:700;min-width:56px;text-align:center}

main{padding:16px;display:none}
main.on{display:block}
.stack{display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.tight{padding:0}
.lbl{font-size:12.5px;color:var(--sub);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.lbl .req{color:#ef4444;margin-left:2px}
.g{color:var(--green)} .r{color:var(--red)} .o{color:var(--orange)} .p{color:var(--violet)} .am{color:var(--amber)} .bl{color:var(--blue)}
.big{font-size:24px;font-weight:700}
.mid{font-size:16px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12.5px;color:var(--sub);line-height:1.6}
.between{display:flex;justify-content:space-between;align-items:center}
.divline{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}

/* entry panel tabs */
.seg3{display:flex;border-bottom:1px solid var(--line)}
.seg3 button{flex:1;padding:11px 4px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg3 button.on.exp{background:var(--orange);color:#fff}
.seg3 button.on.tx,.seg3 button.on.conv{background:var(--card2);color:var(--txt)}
.panelbody{padding:14px;display:flex;flex-direction:column;gap:10px}
.curtoggle{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.curtoggle button{flex:1;padding:8px;font-size:14.5px;font-weight:700;color:var(--sub)}
.curtoggle button.on{background:var(--card2);color:var(--txt)}
body.light .curtoggle button.on{background:#374151;color:#fff}
.err{border-color:#ef4444 !important}
.errtext{color:#ef4444;font-size:12.5px;margin-top:3px}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;padding:7px 11px;border-radius:12px;border:1px solid var(--line2);color:var(--sub)}
.chip.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip button{opacity:.6;color:#f43f5e;font-size:15.5px;line-height:1}
.chip button:active{opacity:1}
.chipadd{font-size:14.5px;padding:7px 11px;border-radius:12px;border:1px solid var(--line2);color:var(--sub)}
.chipinput{flex:1;min-width:110px;padding:7px 10px;font-size:14.5px;border-radius:10px}
.chipok{padding:7px 12px;border-radius:10px;background:var(--card2);color:var(--txt);font-size:14.5px;font-weight:700}
.chipcancel{padding:7px 9px;border-radius:10px;color:var(--sub);font-size:14.5px}
.ratebox{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.ratebox .ok{color:var(--green)} .ratebox .warn{color:var(--amber)} .ratebox .fetch{color:var(--blue)}
.raterow{display:flex;align-items:center;gap:8px}
.raterow span.pre{flex:none;font-size:12.5px;color:var(--sub)}
.raterow input{flex:1;padding:6px 10px;font-size:13.5px}
.manualtag{font-size:12.5px;font-weight:700;color:var(--amber);flex:none}
.savebtn{width:100%;padding:11px;border-radius:14px;font-weight:700;font-size:15.5px;color:#fff;text-align:center;background:#1f2937}
.savebtn.exp{background:var(--orange)}
.savebtn.saved{background:var(--green)}
.savebtn.busy{background:#4b5563}

/* currency switch on home */
.curswitch{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;width:fit-content;margin:0 auto}
.curswitch button{padding:8px 30px;font-size:14.5px;font-weight:700;color:var(--sub)}
.curswitch button.on{background:#1f2937;color:#fff}
body.light .curswitch button.on{background:#1f2937;color:#fff}

/* history sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:13px 16px}
.sechead:active,.sechead.open{background:var(--hov)}
.sechead h3{margin:0;font-size:15px;font-weight:700}
.sechead .cnt{font-size:12.5px;color:var(--sub)}
.sechead .amt{margin-left:auto;font-weight:700;font-size:15px}
.chev{color:var(--sub);flex:none}
.subtabs{display:flex;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;padding:8px;font-size:12.5px;font-weight:700;color:var(--sub)}
.subtabs button.on{background:#1f2937;color:#fff}
.subtabs button.on.orange{background:var(--orange)}
.grouphead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 16px;text-align:left}
.grouphead:active,.grouphead.open{background:var(--hov)}
.grouptag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--sub);font-weight:600}
.groupinfo{flex:1;text-align:left;min-width:0}
.groupinfo p{margin:0}
.groupinfo .t{font-size:15px;font-weight:700}
.groupinfo .s{font-size:12.5px;color:var(--sub)}
.groupamt{font-weight:700;font-size:15px;flex:none}
.pbar{margin:0 16px 6px;height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:4px;background:var(--orange)}
.itemrow{display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--line)}
.itemrow .d{font-size:12.5px;color:var(--sub);width:38px;flex:none}
.itemrow .tags{display:flex;flex-direction:column;gap:3px;flex:none}
.itemrow .tag{font-size:12px;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--sub)}
.itemrow .memo{flex:1;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.itemrow .right{text-align:right;flex:none}
.itemrow .right p{margin:0;font-size:14px;font-weight:700}
.itemrow .right small{font-size:11.5px;color:var(--sub)}
.itemrow .ico{padding:5px;border-radius:8px}
.itemrow .ico:active{background:var(--hov)}
.grouptotal{display:flex;justify-content:space-between;padding:8px 16px;font-size:13px;font-weight:700;background:var(--card2)}
.warnbox{margin:12px;padding:12px;border-radius:12px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.emptybox{padding:34px 18px;text-align:center;color:var(--sub);font-size:14.5px}
.emptybox p:first-child{font-size:30px;margin:0 0 8px}

/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:flex;width:100%}
nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:12px;font-weight:600}
nav button.on{color:var(--txt)}

/* sheet/modal */
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(20px + var(--safe-b));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet h2{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{color:var(--sub);font-size:16px;padding:4px}
.f{margin-bottom:11px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,14px);z-index:60;background:#1f2937;color:#fff;border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* security audit */
.secitem{border-top:1px solid var(--line)}
.secitem button{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left}
.secitem button:active{background:var(--hov)}
.secitem .ic{font-size:15.5px;flex:none}
.secitem .body{flex:1;min-width:0}
.secitem .body .t{font-size:13px;font-weight:600}
.secitem .body .v{font-size:12.5px;color:var(--green);font-weight:700}
.secitem .detail{padding:0 12px 12px;font-size:12.5px;color:var(--sub);line-height:1.6}
.secitem pre{background:#000;color:#34d399;font-size:11px;line-height:1.6;padding:9px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;margin:6px 0 0;font-family:ui-monospace,monospace}
.taxtablerow{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 2px}
.chartwrap{position:relative;padding-left:40px;margin-top:6px}
.yax{position:absolute;left:0;top:0;width:38px;height:130px}
.ytick{position:absolute;right:4px;transform:translateY(-50%);font-size:10.5px;color:var(--sub);white-space:nowrap}
.grid{position:absolute;left:40px;right:0;border-top:1px dashed var(--line);pointer-events:none}
.grid.zero{border-top:1px solid var(--line2)}
.bars{position:relative;display:flex;height:130px}
.col{flex:1;display:flex;flex-direction:column}
.pos{display:flex;align-items:flex-end;justify-content:center}
.neg{display:flex;align-items:flex-start;justify-content:center}
.bar{width:60%;max-width:20px;border-radius:2px}
.xax{display:flex;margin-top:5px}
.xax span{flex:1;text-align:center;font-size:10.5px;color:var(--sub)}
.tip{position:absolute;z-index:5;background:#1f2937;border:1px solid var(--line2);border-radius:10px;padding:7px 11px;text-align:center;top:2px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tip b{display:block;font-size:13.5px}
.tip s{display:block;text-decoration:none;font-size:13.5px;font-weight:700;margin-top:1px}
.dot{width:12px;height:6px;border-radius:99px;position:relative;background:#4b5563}
.dot i{position:absolute;top:0.5px;left:0.5px;width:5px;height:5px;border-radius:50%;background:#fff;transition:transform .15s}
.dot.on{background:var(--green)}
.dot.on i{transform:translateX(6px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ============================================================
   定数・純粋関数
============================================================ */
const MONTHS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
function calcIncomeTax(income){
  if(income<=0)return 0; let tax=0;
  if(income>40000000){tax+=(income-40000000)*0.45;income=40000000;}
  if(income>18000000){tax+=(income-18000000)*0.40;income=18000000;}
  if(income>9000000){tax+=(income-9000000)*0.33;income=9000000;}
  if(income>6950000){tax+=(income-6950000)*0.23;income=6950000;}
  if(income>3300000){tax+=(income-3300000)*0.20;income=3300000;}
  if(income>1950000){tax+=(income-1950000)*0.10;income=1950000;}
  tax+=income*0.05; return Math.round(tax);
}
function fmtJPYFloor(n){const a=Math.abs(Math.floor(n));return (n<0?"-":"")+"¥"+a.toLocaleString("ja-JP");}

const ER_API_URL="https://open.er-api.com/v6/latest/USD";
const RATE_SOURCE_NAME="ExchangeRate-API（市場中間値）";
async function getRate(){
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(ER_API_URL,{signal:ctrl.signal}); clearTimeout(timer);
    if(!res.ok)throw new Error("api fail");
    const data=await res.json(); const rate=data && data.rates && data.rates.JPY;
    if(!rate||typeof rate!=="number"||rate<50||rate>300)return null;
    return Math.round(rate*100)/100;
  }catch(e){console.warn("ExchangeRate-API:",e.message);return null;}
}
function isValidRate(r){return typeof r==="number"&&r>=50&&r<=300;}
function getExpJPY(e){
  if(e.amount_jpy&&e.amount_jpy>0)return e.amount_jpy;
  if(e.amount_usd&&e.amount_usd>0){const rate=isValidRate(e.usd_jpy_rate)?e.usd_jpy_rate:150;return Math.floor(e.amount_usd*rate*100)/100;}
  return 0;
}
function getExpUSD(e){
  if(e.amount_usd!=null&&e.amount_usd>=0)return e.amount_usd;
  const rate=isValidRate(e.usd_jpy_rate)?e.usd_jpy_rate:150;
  return (e.amount_jpy||0)/rate;
}
function calcUsdc(txs,exps,convs){
  const prof=txs.filter(t=>t.currency_type==="USD"&&(t.profit_usd||0)>0);
  const totAcq=prof.reduce((s,t)=>s+(t.profit_usd||0),0);
  const avgRate=totAcq>0?prof.reduce((s,t)=>s+(t.profit_usd||0)*(t.usd_jpy_rate||150),0)/totAcq:0;
  const totExpUsd=exps.filter(e=>e.currency_type==="USD").reduce((s,e)=>s+(e.amount_usd||0),0);
  const totConv=convs.reduce((s,c)=>s+c.amount_usdc,0);
  return {totalAcquired:totAcq,avgRate,totalExpUsd:totExpUsd,totalConverted:totConv,holdings:Math.max(0,totAcq-totExpUsd-totConv)};
}

/* CSV export/import (元アプリと同一フォーマット) */
function csvQ(val){
  const s=String(val==null?"":val);
  const safe=/^[=+\-@\t]/.test(s)?"'"+s:s;
  if(safe.includes(",")||safe.includes('"')||safe.includes("\n")||safe.includes("\r"))return '"'+safe.replace(/"/g,'""')+'"';
  return safe;
}
function parseCSVLine(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===","&&!q){out.push(cur.trim());cur="";}
    else cur+=ch;
  }
  out.push(cur.trim()); return out;
}
function sanitizeImportStr(s,maxLen){
  if(!s||typeof s!=="string")return "";
  const noCtrl=s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"");
  const trimmed=noCtrl.trim().slice(0,maxLen||200);
  return /^[=+\-@\t]/.test(trimmed)?"'"+trimmed:trimmed;
}
function safeParseFloat(s,allowNeg){
  const n=parseFloat(s);
  if(!isFinite(n)||isNaN(n))return 0;
  if(!allowNeg&&n<0)return 0;
  if(Math.abs(n)>1e12)return 0;
  return n;
}
function parseCSVImport(text){
  const raw=text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=[]; let buf="",inQ=false;
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(c==='"')inQ=!inQ;
    if(c==="\n"&&!inQ){lines.push(buf);buf="";} else buf+=c;
  }
  if(buf)lines.push(buf);
  const MAX_ROWS=1000; let txCount=0,expCount=0;
  let section=null,headers=null;
  const txs=[],exps=[],cats={};
  for(const rawLine of lines){
    const line=rawLine.trim();
    if(line.startsWith("## 損益明細")){section="tx";headers=null;continue;}
    if(line.startsWith("## 経費明細")){section="exp";headers=null;continue;}
    if(line.startsWith("## カテゴリ設定")){section="cats";headers=null;continue;}
    if(line.startsWith("#")||!line)continue;
    const cols=parseCSVLine(line);
    if(!headers){headers=cols;continue;}
    if(section==="cats"&&headers){
      const o={}; headers.forEach((h,i)=>o[h]=cols[i]||"");
      if(o.type&&o.values)cats[o.type]=o.values.split("|").map(v=>v.trim()).filter(Boolean).slice(0,50);
      continue;
    }
    if(section==="tx"&&headers){
      if(txCount>=MAX_ROWS)continue;
      const o={}; headers.forEach((h,i)=>o[h]=cols[i]||"");
      if(!o.date||!/^\d{4}-\d{2}-\d{2}$/.test(o.date))continue;
      txs.push({id:uid(),created_at:o.date,category:sanitizeImportStr(o.category,50),detail:sanitizeImportStr(o.detail,50),
        profit_usd:safeParseFloat(o.profit_usd),loss_usd:safeParseFloat(o.loss_usd),
        profit_jpy:safeParseFloat(o.profit_jpy),loss_jpy:safeParseFloat(o.loss_jpy),
        usd_jpy_rate:(()=>{const r=safeParseFloat(o.usd_jpy_rate);return (r>=50&&r<=300)?r:null;})(),
        rate_source:sanitizeImportStr(o.rate_source,100),
        rate_status:parseFloat(o.usd_jpy_rate)&&parseFloat(o.usd_jpy_rate)>=50?"ok":"na",
        currency_type:(safeParseFloat(o.profit_usd)||safeParseFloat(o.loss_usd))?"USD":"JPY",
        memo:sanitizeImportStr(o.memo,200)});
      txCount++;
    }
    if(section==="exp"&&headers){
      if(expCount>=MAX_ROWS)continue;
      const o={}; headers.forEach((h,i)=>o[h]=cols[i]||"");
      if(!o.date||!/^\d{4}-\d{2}-\d{2}$/.test(o.date))continue;
      const amtUsd=safeParseFloat(o.amount_usd);
      exps.push({id:uid(),created_at:o.date,category:sanitizeImportStr(o.category,50),project:sanitizeImportStr(o.project,50),
        amount_jpy:safeParseFloat(o.amount_jpy),amount_usd:amtUsd>0?amtUsd:null,
        usd_jpy_rate:(()=>{const r=safeParseFloat(o.usd_jpy_rate);return (r>=50&&r<=300)?r:null;})(),
        rate_source:sanitizeImportStr(o.rate_source,100),
        rate_status:parseFloat(o.usd_jpy_rate)&&parseFloat(o.usd_jpy_rate)>=50?"ok":"na",
        currency_type:amtUsd>0?"USD":"JPY", memo:sanitizeImportStr(o.memo,200)});
      expCount++;
    }
  }
  return {txs,exps,cats};
}

function computeAll(){
  const isUSD=UI.dispCur==="USD";
  const _yTxs=yTxs(), _yExps=yExps(), _yConvs=yConvs();
  const tProfJPY=_yTxs.reduce((s,t)=>s+(t.profit_jpy||0),0);
  const tLossJPY=_yTxs.reduce((s,t)=>s+(t.loss_jpy||0),0);
  const tProfUSD=_yTxs.reduce((s,t)=>s+(t.profit_usd||0),0);
  const netJPY=tProfJPY-tLossJPY;
  const netUSD=tProfUSD-_yTxs.reduce((s,t)=>s+(t.loss_usd||0),0);
  const totalExpJPY=_yExps.reduce((s,e)=>s+getExpJPY(e),0);
  const totalExpUSD=_yExps.reduce((s,e)=>s+getExpUSD(e),0);
  const usdc=calcUsdc(DB.txs,DB.exps,DB.convs);
  const avgRate=usdc.avgRate;
  const yForex=_yConvs.reduce((s,c)=>s+(c.usd_jpy_rate-avgRate)*c.amount_usdc,0);
  const yForexUSD=_yConvs.reduce((s,c)=>s+(c.usd_jpy_rate>0?(c.usd_jpy_rate-avgRate)*c.amount_usdc/c.usd_jpy_rate:0),0);
  const taxable=Math.max(0,netJPY+yForex-totalExpJPY);
  const taxEst=Math.round(taxable*DB.taxRate/100);
  const pendingTxs=_yTxs.filter(t=>t.rate_status==="pending");
  const convAsTxs=_yConvs.map(c=>{
    const pnlJPY=(c.usd_jpy_rate-avgRate)*c.amount_usdc;
    const pnlUSD=c.usd_jpy_rate>0?pnlJPY/c.usd_jpy_rate:0;
    return {id:c.id,created_at:c.created_at,category:"為替損益",memo:c.memo?c.memo:(c.amount_usdc+" USDC"),
      profit_jpy:pnlJPY>=0?pnlJPY:0, loss_jpy:pnlJPY<0?-pnlJPY:0,
      profit_usd:pnlUSD>=0?pnlUSD:0, loss_usd:pnlUSD<0?-pnlUSD:0,
      usd_jpy_rate:c.usd_jpy_rate, currency_type:"USD", _isConv:true};
  });
  const allHistTxs=[..._yTxs,...convAsTxs];
  const allHistByMonth=allHistTxs.reduce((a,t)=>{const k=t.created_at.slice(0,7);(a[k]=a[k]||[]).push(t);return a;},{});
  const sortedMK=Object.keys(allHistByMonth).sort((a,b)=>b.localeCompare(a));
  const monthlyDataJPY=MONTHS.map((m,i)=>({month:m,v:allHistTxs.filter(t=>new Date(t.created_at).getMonth()===i).reduce((s,t)=>s+(t.profit_jpy||0)-(t.loss_jpy||0),0)}));
  const monthlyDataUSD=MONTHS.map((m,i)=>({month:m,v:allHistTxs.filter(t=>new Date(t.created_at).getMonth()===i).reduce((s,t)=>s+(t.profit_usd||0)-(t.loss_usd||0),0)}));
  const monthlyData=isUSD?monthlyDataUSD:monthlyDataJPY;
  // 経費のみ／実質損益（損益－経費）月別系列（円・USD両方）
  const expMonthlyJPY=MONTHS.map((m,i)=>_yExps.filter(e=>new Date(e.created_at).getMonth()===i).reduce((s,e)=>s+getExpJPY(e),0));
  const expMonthlyUSD=MONTHS.map((m,i)=>_yExps.filter(e=>new Date(e.created_at).getMonth()===i).reduce((s,e)=>s+getExpUSD(e),0));
  const chartSeries={
    pl:{JPY:monthlyDataJPY.map(m=>m.v),USD:monthlyDataUSD.map(m=>m.v)},
    ex:{JPY:expMonthlyJPY.map(v=>-v),USD:expMonthlyUSD.map(v=>-v)},
    net:{JPY:monthlyDataJPY.map((m,i)=>m.v-expMonthlyJPY[i]),USD:monthlyDataUSD.map((m,i)=>m.v-expMonthlyUSD[i])},
  };
  const allCatSet=new Set([...DB.txCats,...allHistTxs.map(t=>t.category)]);
  const catPnl=[...allCatSet].map(cat=>{
    const items=allHistTxs.filter(t=>t.category===cat);
    if(!items.length)return null;
    return {cat,netJPY:items.reduce((s,t)=>s+(t.profit_jpy||0)-(t.loss_jpy||0),0),netUSD:items.reduce((s,t)=>s+(t.profit_usd||0)-(t.loss_usd||0),0),count:items.length};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.netJPY)-Math.abs(a.netJPY));
  const corruptedExps=_yExps.filter(e=>e.currency_type==="USD"&&!e.amount_jpy&&!isValidRate(e.usd_jpy_rate)&&!e.amount_usd);
  const expByCat=_yExps.reduce((a,e)=>{(a[e.category]=a[e.category]||[]).push(e);return a;},{});
  const catTotals=Object.keys(expByCat).map(cat=>{const it=expByCat[cat];return {cat,total:it.reduce((s,e)=>s+getExpJPY(e),0),totalU:it.reduce((s,e)=>s+getExpUSD(e),0),items:it};}).sort((a,b)=>b.total-a.total);
  const expByProj=_yExps.reduce((a,e)=>{const k=e.project||"（未設定）";(a[k]=a[k]||[]).push(e);return a;},{});
  const projTotals=Object.keys(expByProj).map(proj=>{const it=expByProj[proj];return {proj,total:it.reduce((s,e)=>s+getExpJPY(e),0),totalU:it.reduce((s,e)=>s+getExpUSD(e),0),items:it};}).sort((a,b)=>b.total-a.total);
  const expByMonth=_yExps.reduce((a,e)=>{const k=e.created_at.slice(0,7);(a[k]=a[k]||[]).push(e);return a;},{});
  const sortedExpMK=Object.keys(expByMonth).sort((a,b)=>b.localeCompare(a));
  return {isUSD,yTxs:_yTxs,yExps:_yExps,yConvs:_yConvs,tProfJPY,tLossJPY,netJPY,netUSD,totalExpJPY,totalExpUSD,usdc,avgRate,yForex,yForexUSD,taxable,taxEst,pendingTxs,allHistTxs,allHistByMonth,sortedMK,monthlyData,chartSeries,catPnl,corruptedExps,catTotals,projTotals,expByMonth,sortedExpMK};
}

  if(UI.entryTab==="exp"){const isU=UI.newExp.currency_type==="USD";return {amount:isU?!UI.newExp.amount_usd:!UI.newExp.amount_jpy,category:!UI.newExp.category};}
  return {amount:!UI.newConv.amount_usdc};
}
async function handleSaveNew(){
  UI.showErr=true;
  const errs=validateNew();
  if(Object.values(errs).some(Boolean)){render();return;}
  UI.showErr=false;UI.fetching=true;render();
  if(UI.entryTab==="tx"){
    const f=UI.newTx, isU=f.currency_type==="USD";
    let r=null,rSrc=null,rStatus="na";
    if(isU){const resolved=await resolveRate(f.created_at);if(resolved){r=resolved.rate;rSrc=resolved.src;rStatus="ok";}else rStatus="pending";}
    const pu=parseFloat(f.profit_usd)||0, lu=parseFloat(f.loss_usd)||0;
    DB.txs.unshift({id:uid(),currency_type:f.currency_type,profit_usd:isU?pu:0,loss_usd:isU?lu:0,
      profit_jpy:isU&&r?Math.ceil(pu*r*100)/100:(isU?0:parseFloat(f.profit_jpy)||0),
      loss_jpy:isU&&r?Math.floor(lu*r*100)/100:(isU?0:parseFloat(f.loss_jpy)||0),
      usd_jpy_rate:r,rate_source:rSrc,rate_status:rStatus,category:f.category,detail:f.detail||"",memo:f.memo,created_at:f.created_at||todayStr()});
    UI.newTx=initTx();
  }else if(UI.entryTab==="exp"){
    const f=UI.newExp, isU=f.currency_type==="USD";
    let r=null,rSrc=null,rStatus="na";
    if(isU){const resolved=await resolveRate(f.created_at);if(resolved){r=resolved.rate;rSrc=resolved.src;rStatus="ok";}else rStatus="pending";}
    const amt=parseFloat(f.amount_usd)||0;
    DB.exps.unshift({id:uid(),currency_type:f.currency_type,amount_usd:isU?amt:null,
      amount_jpy:isU&&r?Math.floor(amt*r*100)/100:(isU?0:parseFloat(f.amount_jpy)||0),
      usd_jpy_rate:r,rate_source:rSrc,rate_status:rStatus,category:f.category||"その他",project:f.project||"",memo:f.memo,created_at:f.created_at||todayStr()});
    UI.newExp=initExp();
  }else{
    const f=UI.newConv;
    const resolved=await resolveRate(f.created_at);
    const r=resolved?resolved.rate:150;
    DB.convs.unshift({id:uid(),amount_usdc:parseFloat(f.amount_usdc)||0,usd_jpy_rate:r,memo:f.memo,created_at:f.created_at||todayStr()});
    UI.newConv=initConv();
  }
  UI.manualRate="";UI.fetchedRate=null;UI.fetching=false;UI.saved=true;saveDB();render();
  setTimeout(()=>{UI.saved=false;UI.showErr=false;render();},1300);
}

function exportCSV(){
  try{
    const c=computeAll();
    const sum=[["# 📒損益台帳 エクスポート"],["年度",UI.year+"年"],["出力日時",nowJST()],["為替レート根拠","ExchangeRate-API 市場中間値（所得税基本通達 法第57条の3関係 3-2）"],[""],
      ["## サマリー"],["項目","金額（JPY）"],["課税所得",c.taxable],[csvQ("推定税額（"+DB.taxRate+"% 固定）"),c.taxEst],[""]];
    const catSection=[["## カテゴリ設定"],["type","values"],
      ["tx_cats",DB.txCats.map(csvQ).join("|")],["tx_details",DB.txDetails.map(csvQ).join("|")],
      ["exp_cats",DB.expCats.map(csvQ).join("|")],["exp_projs",DB.expProjs.map(csvQ).join("|")],[""]];
    const h=["date","category","detail","profit_usd","loss_usd","profit_jpy","loss_jpy","usd_jpy_rate","rate_source","memo"];
    const rows=c.yTxs.map(t=>[t.created_at,csvQ(t.category),csvQ(t.detail||""),t.profit_usd||0,t.loss_usd||0,t.profit_jpy||0,t.loss_jpy||0,t.usd_jpy_rate||"",csvQ(t.rate_source||""),csvQ(t.memo||"")]);
    const hE=["date","category","project","amount_jpy","amount_usd","usd_jpy_rate","rate_source","memo"];
    const rowsE=c.yExps.map(e=>[e.created_at,csvQ(e.category),csvQ(e.project||""),e.amount_jpy,e.amount_usd||"",e.usd_jpy_rate||"",csvQ(e.rate_source||""),csvQ(e.memo||"")]);
    const csv=sum.map(r=>r.join(",")).join("\n")+catSection.map(r=>r.join(",")).join("\n")+"## 損益明細\n"+[h,...rows].map(r=>r.join(",")).join("\n")+"\n\n## 経費明細\n"+[hE,...rowsE].map(r=>r.join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="損益台帳_"+todayStr()+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},500);
  }catch(err){toast("CSV出力エラー: "+err.message);}
}
function triggerImport(){document.getElementById("importFile").click();}
function handleImportFile(e){
  const file=e.target.files[0]; if(!file)return;
  if(file.size>1*1024*1024){UI.importMsg={ok:false,msg:"ファイルが大きすぎます（上限1MB）"};e.target.value="";render();return;}
  const reader=new FileReader();
  reader.onerror=()=>{UI.importMsg={ok:false,msg:"ファイルの読み込みに失敗しました"};e.target.value="";render();};
  reader.onload=ev=>{
    try{
      const {txs:newTxs,exps:newExps,cats}=parseCSVImport(ev.target.result);
      if(!newTxs.length&&!newExps.length){UI.importMsg={ok:false,msg:"インポートできるデータが見つかりませんでした"};render();return;}
      DB.txs=[...DB.txs,...newTxs]; DB.exps=[...DB.exps,...newExps];
      if(cats.tx_cats&&cats.tx_cats.length)DB.txCats=[...new Set([...DB.txCats,...cats.tx_cats])];
      if(cats.tx_details&&cats.tx_details.length)DB.txDetails=[...new Set([...DB.txDetails,...cats.tx_details])];
      if(cats.exp_cats&&cats.exp_cats.length)DB.expCats=[...new Set([...DB.expCats,...cats.exp_cats])];
      if(cats.exp_projs&&cats.exp_projs.length)DB.expProjs=[...new Set([...DB.expProjs,...cats.exp_projs])];
      const catMsg=(cats.tx_cats||cats.tx_details||cats.exp_cats||cats.exp_projs)?"・カテゴリ設定を復元しました":"";
      saveDB();
      UI.importMsg={ok:true,msg:"✓ 損益"+newTxs.length+"件・経費"+newExps.length+"件をインポートしました"+catMsg};
      render();
      setTimeout(()=>{UI.importMsg=null;render();},4000);
    }catch(err){UI.importMsg={ok:false,msg:"エラー: "+err.message};render();}
  };
  reader.readAsText(file,"utf-8"); e.target.value="";
}

/* ============================================================
   チャート (SVG不要・divベース)
============================================================ */
function chartHTML(series,isUSD,mode){
  const H=130;
  const v=series;
  const maxP=Math.max(0,...v), minN=Math.min(0,...v), span=maxP-minN;
  const posH=span?Math.round(H*(maxP/span)):Math.round(H/2), negH=H-posH;
  const ticks=[];
  if(span){
    if(maxP>0){ticks.push({v:maxP,y:0});ticks.push({v:maxP/2,y:posH/2});}
    ticks.push({v:0,y:posH,zero:true});
    if(minN<0){ticks.push({v:minN/2,y:posH+negH/2});ticks.push({v:minN,y:H});}
  }else ticks.push({v:0,y:posH,zero:true});
  function kfmt(x){const a=Math.abs(x);if(a>=1e8)return (x/1e8).toFixed(a>=1e9?0:1)+"億";if(a>=1000)return Math.round(x/1000)+"k";return String(Math.round(x));}
  let h='<div class="yax">'; ticks.forEach(t=>h+='<div class="ytick" style="top:'+t.y+'px">'+kfmt(t.v)+"</div>"); h+="</div>";
  ticks.forEach(t=>h+='<div class="grid'+(t.zero?" zero":"")+'" style="top:'+t.y+'px"></div>');
  h+='<div class="bars">';
  v.forEach((val,i)=>{
    const col=mode==="ex"?"var(--orange)":(val<0?"var(--red)":"var(--green)");
    let ph=0,nh=0;
    if(span){ if(val>0)ph=Math.max(2,Math.round(posH*(val/maxP))); else if(val<0)nh=Math.max(2,Math.round(negH*(val/minN))); }
    h+='<div class="col" onclick="UI.chartSel=(UI.chartSel==='+i+'?-1:'+i+');render()">'+
       '<div class="pos" style="height:'+posH+'px">'+(ph?'<div class="bar" style="height:'+ph+"px;background:"+col+'"></div>':"")+"</div>"+
       '<div class="neg" style="height:'+negH+'px">'+(nh?'<div class="bar" style="height:'+nh+"px;background:"+col+'"></div>':"")+"</div></div>";
  });
  h+="</div>";
  if(UI.chartSel>=0){
    const val=v[UI.chartSel];
    const dispVal=mode==="ex"?-val:val;
    const tcol=mode==="ex"?"var(--orange)":(val<0?"var(--red)":"var(--green)");
    const lx=Math.min(83,Math.max(17,(UI.chartSel+0.5)/12*100));
    h+='<div class="tip" style="left:'+lx+'%;transform:translateX(-50%)"><b>'+(UI.chartSel+1)+"月</b><s class=\"num\" style=\"color:"+tcol+'">'+(isUSD?fmtUSD(dispVal):fmtJPY(dispVal))+"</s></div>";
  }
  h+='<div class="xax">'; for(let i=0;i<12;i++)h+="<span>"+(i+1)+"月</span>"; h+="</div>";
  return h;
}

function rateStatusHTML(currency_type,cachedRate){
  if(currency_type==="JPY")return "";
  let h='<div class="ratebox">';
  if(UI.fetching)h+='<p class="fetch">ドル円レート自動取得中...</p>';
  else if(UI.fetchedRate&&!UI.manualRate)h+='<p class="ok">自動取得レート: ¥'+UI.fetchedRate+'（手動入力で上書き可）</p>';
  else if(cachedRate&&!UI.manualRate)h+='<p class="ok">自動取得レート: ¥'+cachedRate+'（手動入力で上書き可）</p>';
  else if(UI.fetchFailed&&!UI.manualRate)h+='<p class="warn">自動取得失敗。下欄に手動入力してください</p>';
  else if(!UI.manualRate)h+='<p>保存時にドル円レートを自動取得します（手動入力で上書き可）</p>';
  h+='<div class="raterow"><span class="pre">手動レート ¥</span><input type="number" inputmode="decimal" placeholder="'+
     (UI.fetchedRate||cachedRate?String(UI.fetchedRate||cachedRate):"例：149.50（空白で自動取得）")+
     '" value="'+esc(UI.manualRate)+'" oninput="UI.manualRate=this.value">'+
     (UI.manualRate?'<span class="manualtag">手動優先</span>':"")+"</div></div>";
  return h;
}

      if(UI.expView==="month"){
