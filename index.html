<style>
:root{
  --bg:#030712; --card:#111827; --card2:#1f2937; --line:#1f2937; --line2:#374151;
  --txt:#f9fafb; --sub:#6b7280; --hov:rgba(255,255,255,.04);
  --green:#10b981; --red:#f43f5e; --orange:#f97316; --violet:#a78bfa; --amber:#f59e0b; --blue:#60a5fa;
  /* グラフの棒の色（ダーク・ライト両方で色覚チェック済み） */
  --m-pl:#059669; --m-loss:#e11d48; --m-exp:#ea580c; --m-tax:#8b5cf6;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
body.light{
  --bg:#f3f4f6; --card:#ffffff; --card2:#f9fafb; --line:#e5e7eb; --line2:#d1d5db;
  --txt:#111827; --sub:#9ca3af; --hov:rgba(0,0,0,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-bottom:calc(78px + var(--safe-b));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#6b7280}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=date]{color-scheme:dark;font-size:14px;line-height:1.3;padding:8px 10px;min-height:36px;display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:center}
input[type=date]::-webkit-date-and-time-value{text-align:center;margin:0;line-height:1.3}
body.light input[type=date]{color-scheme:light}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}
a{color:var(--blue)}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 10px) 16px 2px}
.brandrow h1{margin:0;font-size:15.5px;font-weight:700;line-height:1.2}
.brandrow p{margin:1px 0 0;font-size:12.5px;color:var(--sub)}
.yearbar{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.ybtn{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--sub)}
.ybtn:active{background:var(--hov)}
.yearbar b{font-size:14.5px;font-weight:700;min-width:56px;text-align:center}

main{padding:16px;display:none}
main.on{display:block}
.stack{display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.tight{padding:0}
.lbl{font-size:12.5px;color:var(--sub);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.lbl .req{color:#ef4444;margin-left:2px}
.g{color:var(--green)} .r{color:var(--red)} .o{color:var(--orange)} .p{color:var(--violet)} .am{color:var(--amber)} .bl{color:var(--blue)}
.big{font-size:24px;font-weight:700}
.mid{font-size:16px;font-weight:700}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row2>*{min-width:0}
.hint{font-size:12.5px;color:var(--sub);line-height:1.6}
.between{display:flex;justify-content:space-between;align-items:center}
.divline{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}

/* entry panel tabs */
.seg3{display:flex;border-bottom:1px solid var(--line)}
.seg3 button{flex:1;padding:11px 4px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg3 button.on.exp{background:var(--orange);color:#fff}
.seg3 button.on.tx,.seg3 button.on.conv{background:var(--card2);color:var(--txt)}
.panelbody{padding:14px;display:flex;flex-direction:column;gap:10px}
.curtoggle{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.curtoggle button{flex:1;padding:8px;font-size:14.5px;font-weight:700;color:var(--sub)}
.curtoggle button.on{background:var(--card2);color:var(--txt)}
body.light .curtoggle button.on{background:#374151;color:#fff}
.err{border-color:#ef4444 !important}
.errtext{color:#ef4444;font-size:12.5px;margin-top:3px}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;padding:7px 11px;border-radius:12px;border:1px solid var(--line2);color:var(--sub)}
.chip.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip button{opacity:.6;color:#f43f5e;font-size:15.5px;line-height:1}
.chip button:active{opacity:1}
.chipadd{font-size:14.5px;padding:7px 11px;border-radius:12px;border:1px solid var(--line2);color:var(--sub)}
.chipinput{flex:1;min-width:110px;padding:7px 10px;font-size:14.5px;border-radius:10px}
.chipok{padding:7px 12px;border-radius:10px;background:var(--card2);color:var(--txt);font-size:14.5px;font-weight:700}
.chipcancel{padding:7px 9px;border-radius:10px;color:var(--sub);font-size:14.5px}
.ratebox{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.ratebox .ok{color:var(--green)} .ratebox .warn{color:var(--amber)} .ratebox .fetch{color:var(--blue)}
.raterow{display:flex;align-items:center;gap:8px}
.raterow span.pre{flex:none;font-size:12.5px;color:var(--sub)}
.raterow input{flex:1;padding:6px 10px;font-size:13.5px}
.manualtag{font-size:12.5px;font-weight:700;color:var(--amber);flex:none}
.savebtn{width:100%;padding:11px;border-radius:14px;font-weight:700;font-size:15.5px;color:#fff;text-align:center;background:#1f2937}
.savebtn.exp{background:var(--orange)}
.savebtn.saved{background:var(--green)}
.savebtn.busy{background:#4b5563}

/* currency switch on home */
.curswitch{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;width:fit-content;margin:0 auto}
.curswitch button{padding:8px 30px;font-size:14.5px;font-weight:700;color:var(--sub)}
.curswitch button.on{background:#1f2937;color:#fff}
body.light .curswitch button.on{background:#1f2937;color:#fff}

/* history sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:13px 16px}
.sechead:active,.sechead.open{background:var(--hov)}
.sechead h3{margin:0;font-size:15px;font-weight:700}
.sechead .cnt{font-size:12.5px;color:var(--sub)}
.sechead .amt{margin-left:auto;font-weight:700;font-size:15px}

<script>
"use strict";
/* ============================================================
   定数・純粋関数
============================================================ */
const MONTHS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
function calcIncomeTax(income){
  if(income<=0)return 0; let tax=0;
  if(income>40000000){tax+=(income-40000000)*0.45;income=40000000;}
  if(income>18000000){tax+=(income-18000000)*0.40;income=18000000;}
  if(income>9000000){tax+=(income-9000000)*0.33;income=9000000;}
  if(income>6950000){tax+=(income-6950000)*0.23;income=6950000;}
  if(income>3300000){tax+=(income-3300000)*0.20;income=3300000;}
  if(income>1950000){tax+=(income-1950000)*0.10;income=1950000;}
  tax+=income*0.05; return Math.round(tax);
}
function fmtJPYFloor(n){const a=Math.abs(Math.floor(n));return (n<0?"-":"")+"¥"+a.toLocaleString("ja-JP");}
function fmtUSDFloor(n){const a=Math.floor(Math.abs(n)*100)/100;return (n<0?"-":"")+"$"+a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtJPY(n){const a=Math.abs(n);return (n<0?"-":"")+"¥"+a.toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtUSD(n){return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function todayStr(){const j=new Date(Date.now()+9*3600*1000);return j.toISOString().slice(0,10);}
function nowJST(){const d=new Date(),j=new Date(d.getTime()+9*3600000);return j.toISOString().slice(0,16).replace("T"," ")+" JST";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* onclick 属性に文字列を渡すとき用：JSの文字列にしてからHTML用にエスケープ（「'」や「"」を含む名前でも壊れない） */
function jsArg(v){return esc(JSON.stringify(String(v)));}
function toggleOpen(field,key){UI[field][key]=!UI[field][key];render();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

const ER_API_URL="https://open.er-api.com/v6/latest/USD";
const RATE_SOURCE_NAME="ExchangeRate-API（市場中間値）";
async function getRate(){
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(ER_API_URL,{signal:ctrl.signal}); clearTimeout(timer);
    if(!res.ok)throw new Error("api fail");
    const data=await res.json(); const rate=data && data.rates && data.rates.JPY;
    if(!rate||typeof rate!=="number"||rate<50||rate>300)return null;
    return Math.round(rate*100)/100;
  }catch(e){console.warn("ExchangeRate-API:",e.message);return null;}
}
const HIST_API="https://api.frankfurter.dev/v1/";
const HIST_SOURCE_NAME="Frankfurter（ECB参照レート）";
async function getHistRate(date){
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(HIST_API+date+"?base=USD&symbols=JPY",{signal:ctrl.signal}); clearTimeout(timer);
    if(!res.ok)throw new Error("api fail");
    const data=await res.json(); const rate=data&&data.rates&&data.rates.JPY;
    if(!rate||typeof rate!=="number"||rate<50||rate>300)return null;
    return Math.round(rate*100)/100;
  }catch(e){console.warn("Frankfurter:",e.message);return null;}
}
/* その日のドル円レート：当日以降=ExchangeRate-API、過去日付=その日のECB参照レート */
async function getRateForDate(date){
  if(!date||date>=todayStr()){const r=await getRate();return r?{rate:r,src:RATE_SOURCE_NAME}:null;}
  const r=await getHistRate(date);
  return r?{rate:r,src:HIST_SOURCE_NAME}:null;
}
function isValidRate(r){return typeof r==="number"&&r>=50&&r<=300;}
/* 手入力の年をドル表示するための、その年の平均レート（ECB参照レートの年平均） */
const YEAR_RATE_SRC="Frankfurter（ECB）年平均";
async function getYearAvgRate(y){
  try{
    const today=todayStr(), from=y+"-01-01", to=(y+"-12-31")<today?(y+"-12-31"):today;
    if(from>today)return null;
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),10000);
    const res=await fetch(HIST_API+from+".."+to+"?base=USD&symbols=JPY",{signal:ctrl.signal}); clearTimeout(timer);
    if(!res.ok)throw new Error("api fail");
    const data=await res.json(), vals=Object.values((data&&data.rates)||{}).map(o=>o&&o.JPY).filter(isValidRate);
    if(!vals.length)return null;
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100;
  }catch(e){console.warn("Frankfurter:",e.message);return null;}
}
function r2(n){return Math.round(n*100)/100;}
/* 入力通貨からもう一方の通貨を計算して行データを作る */
function buildTx(id,f,r,rSrc){
  const isU=f.currency_type==="USD";
  let pu,lu,pj,lj;
  if(isU){pu=parseFloat(f.profit_usd)||0;lu=parseFloat(f.loss_usd)||0;pj=r?Math.ceil(pu*r*100)/100:0;lj=r?Math.floor(lu*r*100)/100:0;}
  else{pj=parseFloat(f.profit_jpy)||0;lj=parseFloat(f.loss_jpy)||0;pu=r?r2(pj/r):0;lu=r?r2(lj/r):0;}
  return {id,currency_type:f.currency_type,profit_usd:pu,loss_usd:lu,profit_jpy:pj,loss_jpy:lj,
    usd_jpy_rate:r||null,rate_source:r?rSrc:null,rate_status:r?"ok":"pending",
    category:f.category,detail:f.detail||"",memo:f.memo,created_at:f.created_at||todayStr()};
}
function buildExp(id,f,r,rSrc){
  const isU=f.currency_type==="USD";
  let au,aj;
  if(isU){au=parseFloat(f.amount_usd)||0;aj=r?Math.floor(au*r*100)/100:0;}
  else{aj=parseFloat(f.amount_jpy)||0;au=r?r2(aj/r):null;}
  return {id,currency_type:f.currency_type,amount_usd:au,amount_jpy:aj,
    usd_jpy_rate:r||null,rate_source:r?rSrc:null,rate_status:r?"ok":"pending",
    category:f.category||"その他",project:f.project||"",memo:f.memo,created_at:f.created_at||todayStr()};
}
function getExpJPY(e){
  if(e.amount_jpy&&e.amount_jpy>0)return e.amount_jpy;
  if(e.amount_usd&&e.amount_usd>0){const rate=isValidRate(e.usd_jpy_rate)?e.usd_jpy_rate:150;return Math.floor(e.amount_usd*rate*100)/100;}
  return 0;
}
function getExpUSD(e){
  if(e.amount_usd!=null&&e.amount_usd>=0)return e.amount_usd;
  const rate=isValidRate(e.usd_jpy_rate)?e.usd_jpy_rate:150;
  return (e.amount_jpy||0)/rate;
}
function calcUsdc(txs,exps,convs){
  const prof=txs.filter(t=>t.currency_type==="USD"&&(t.profit_usd||0)>0);
  const totAcq=prof.reduce((s,t)=>s+(t.profit_usd||0),0);
  const avgRate=totAcq>0?prof.reduce((s,t)=>s+(t.profit_usd||0)*(t.usd_jpy_rate||150),0)/totAcq:0;
  const totExpUsd=exps.filter(e=>e.currency_type==="USD").reduce((s,e)=>s+(e.amount_usd||0),0);
  const totConv=convs.reduce((s,c)=>s+c.amount_usdc,0);
  return {totalAcquired:totAcq,avgRate,totalExpUsd:totExpUsd,totalConverted:totConv,holdings:Math.max(0,totAcq-totExpUsd-totConv)};
}

/* CSV export/import (元アプリと同一フォーマット) */
function csvQ(val){
  const s=String(val==null?"":val);
  const safe=/^[=+\-@\t]/.test(s)?"'"+s:s;
  if(safe.includes(",")||safe.includes('"')||safe.includes("\n")||safe.includes("\r"))return '"'+safe.replace(/"/g,'""')+'"';
  return safe;
}
function parseCSVLine(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===","&&!q){out.push(cur.trim());cur="";}
    else cur+=ch;
  }
  out.push(cur.trim()); return out;
}
function sanitizeImportStr(s,maxLen){
  if(!s||typeof s!=="string")return "";
  let t=s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"").trim();
  if(/^'[=+\-@\t]/.test(t))t=t.slice(1); // 書き出し時に付けた数式よけの「'」を外す（画面表示は常にエスケープ済み）
  return t.slice(0,maxLen||200);
}
function safeParseFloat(s,allowNeg){
  const n=parseFloat(s);
  if(!isFinite(n)||isNaN(n))return 0;
  if(!allowNeg&&n<0)return 0;
  if(Math.abs(n)>1e12)return 0;
  return n;
}
function parseCSVImport(text){
  const raw=text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=[]; let buf="",inQ=false;
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(c==='"')inQ=!inQ;
    if(c==="\n"&&!inQ){lines.push(buf);buf="";} else buf+=c;
  }
  if(buf)lines.push(buf);
  const MAX_ROWS=50000, SECTIONS={"年次手入力":"yearly","損益明細":"tx","経費明細":"exp","カテゴリ設定":"cats","設定":"settings","円転明細":"conv","資産":"pf","現物計画":"plan"};
  let section=null,headers=null,truncated=false;
  const txs=[],exps=[],convs=[],cats={},yearly={},settings={},meta={version:0},seen=new Set();
  let pf=null,plan=null;
  const goodRate=s=>{const r=safeParseFloat(s);return (r>=50&&r<=300)?r:null;};
  const idOf=s=>{let id=(typeof s==="string"&&/^[\w-]{1,40}$/.test(s))?s:"";if(!id||seen.has(id))id=uid();seen.add(id);return id;};
  const status=(s,rate)=>(s==="ok"||s==="na"||s==="pending")?s:(rate?"ok":"na");
  for(const rawLine of lines){
    const line=rawLine.trim();
    if(line.startsWith("## ")){section=SECTIONS[line.slice(3).split(",")[0].trim()]||"skip";headers=null;
      if(section==="pf"&&!pf)pf=pfDefault(); if(section==="plan"&&!plan)plan=[]; continue;}
    if(line.startsWith("#")||!line)continue;
    const cols=parseCSVLine(line);
    if(section===null){if(cols[0]==="backup_version")meta.version=parseInt(cols[1],10)||0;continue;}
    if(section==="skip")continue;
    if(!headers){headers=cols;continue;}
    const o={}; headers.forEach((h,i)=>o[h]=cols[i]||"");
    if(section==="settings"){if(o.key)settings[o.key]=o.value;continue;}
    if(section==="pf"){if(Object.prototype.hasOwnProperty.call(pf,o.asset))pf[o.asset]=Math.max(0,safeParseFloat(o.quantity)||0);continue;}
    if(section==="plan"){
      if(PLAN_COINS.includes(o.asset)&&(o.currency==="JPY"||o.currency==="USDC")&&!plan.some(x=>x.sym===o.asset))
        plan.push({sym:o.asset,cur:o.currency,budget:Math.max(0,safeParseFloat(o.budget)||0),invested:Math.max(0,safeParseFloat(o.invested)||0),lot:Math.max(0,safeParseFloat(o.lot)||0)});
      continue;
    }
    if(section==="yearly"){
      if(/^\d{4}$/.test(o.year)){const r=goodRate(o.usd_jpy_rate);
        yearly[o.year]={pl:safeParseFloat(o.pl_jpy,true),exp:safeParseFloat(o.exp_jpy),taxable:o.taxable_jpy===""||o.taxable_jpy==null?null:safeParseFloat(o.taxable_jpy),
          rate:r,rateSrc:r?sanitizeImportStr(o.rate_source,100):""};}
      continue;
    }
    if(section==="cats"){
      if(o.type&&o.values)cats[o.type]=o.values.split("|").map(v=>sanitizeImportStr(v,100)).filter(Boolean).slice(0,500);
      continue;
    }
    if(!o.date||!/^\d{4}-\d{2}-\d{2}$/.test(o.date))continue;
    if(txs.length+exps.length+convs.length>=MAX_ROWS){truncated=true;continue;}
    if(section==="conv"){
      convs.push({id:idOf(o.id),created_at:o.date,amount_usdc:safeParseFloat(o.amount_usdc),usd_jpy_rate:goodRate(o.usd_jpy_rate)||150,memo:sanitizeImportStr(o.memo,2000)});
    }else if(section==="tx"){
      const r=goodRate(o.usd_jpy_rate);
      txs.push({id:idOf(o.id),created_at:o.date,category:sanitizeImportStr(o.category,100),detail:sanitizeImportStr(o.detail,100),
        profit_usd:safeParseFloat(o.profit_usd),loss_usd:safeParseFloat(o.loss_usd),
        profit_jpy:safeParseFloat(o.profit_jpy),loss_jpy:safeParseFloat(o.loss_jpy),
        usd_jpy_rate:r,rate_source:sanitizeImportStr(o.rate_source,100),rate_status:status(o.rate_status,r),
        currency_type:(o.currency_type==="USD"||o.currency_type==="JPY")?o.currency_type:((safeParseFloat(o.profit_usd)||safeParseFloat(o.loss_usd))?"USD":"JPY"),
        memo:sanitizeImportStr(o.memo,2000)});
    }else if(section==="exp"){
      const r=goodRate(o.usd_jpy_rate), amtUsd=safeParseFloat(o.amount_usd);
      exps.push({id:idOf(o.id),created_at:o.date,category:sanitizeImportStr(o.category,100),project:sanitizeImportStr(o.project,100),
        amount_jpy:safeParseFloat(o.amount_jpy),amount_usd:amtUsd>0?amtUsd:null,
        usd_jpy_rate:r,rate_source:sanitizeImportStr(o.rate_source,100),rate_status:status(o.rate_status,r),
        currency_type:(o.currency_type==="USD"||o.currency_type==="JPY")?o.currency_type:(amtUsd>0?"USD":"JPY"),memo:sanitizeImportStr(o.memo,2000)});
    }
  }
  return {txs,exps,convs,cats,yearly,settings,meta,truncated,pf,plan};
}

/* 年次集計：明細がある年は明細から計算、手入力がある年は手入力を優先 */
function detailYearTotals(y){
  const txs=DB.txs.filter(t=>yr(t.created_at)===y), exps=DB.exps.filter(e=>yr(e.created_at)===y), convs=DB.convs.filter(c=>yr(c.created_at)===y);
  const avg=calcUsdc(DB.txs,DB.exps,DB.convs).avgRate;
  const net=txs.reduce((s,t)=>s+(t.profit_jpy||0)-(t.loss_jpy||0),0);
  const fx=convs.reduce((s,c)=>s+(c.usd_jpy_rate-avg)*c.amount_usdc,0);
  const exp=exps.reduce((s,e)=>s+getExpJPY(e),0);
  const netU=txs.reduce((s,t)=>s+(t.profit_usd||0)-(t.loss_usd||0),0);
  const fxU=convs.reduce((s,c)=>s+(c.usd_jpy_rate>0?(c.usd_jpy_rate-avg)*c.amount_usdc/c.usd_jpy_rate:0),0);
  const expU=exps.reduce((s,e)=>s+getExpUSD(e),0);
  return {pl:net+fx,exp,net:net+fx-exp,taxable:Math.max(0,net+fx-exp),plU:netU+fxU,expU,netU:netU+fxU-expU};
}
function yearRows(){
  const ys=new Set();
  DB.txs.forEach(t=>ys.add(yr(t.created_at))); DB.exps.forEach(e=>ys.add(yr(e.created_at))); DB.convs.forEach(c=>ys.add(yr(c.created_at)));
  Object.keys(DB.yearly).forEach(k=>ys.add(+k));
  return [...ys].filter(y=>isFinite(y)).sort((a,b)=>a-b).map(y=>{
    const m=DB.yearly[y];
    if(m){
      const pl=+m.pl||0, exp=+m.exp||0, taxable=(m.taxable!=null&&m.taxable!=="")?(+m.taxable||0):Math.max(0,pl-exp);
      const r=isValidRate(m.rate)?m.rate:null;
      return {y,src:"manual",pl,exp,net:pl-exp,taxable,rate:r,rateSrc:m.rateSrc||"",plU:r?pl/r:null,expU:r?exp/r:null,netU:r?(pl-exp)/r:null};
    }
    const d=detailYearTotals(y); return Object.assign({y,src:"detail",rate:null},d);
  });
}

function computeAll(){
  const isUSD=UI.dispCur==="USD";
  const _yTxs=yTxs(), _yExps=yExps(), _yConvs=yConvs();
  const tProfJPY=_yTxs.reduce((s,t)=>s+(t.profit_jpy||0),0);
  const tLossJPY=_yTxs.reduce((s,t)=>s+(t.loss_jpy||0),0);
  const tProfUSD=_yTxs.reduce((s,t)=>s+(t.profit_usd||0),0);
  const netJPY=tProfJPY-tLossJPY;
  const netUSD=tProfUSD-_yTxs.reduce((s,t)=>s+(t.loss_usd||0),0);
  const totalExpJPY=_yExps.reduce((s,e)=>s+getExpJPY(e),0);
  const totalExpUSD=_yExps.reduce((s,e)=>s+getExpUSD(e),0);
  const usdc=calcUsdc(DB.txs,DB.exps,DB.convs);
  const avgRate=usdc.avgRate;
  const yForex=_yConvs.reduce((s,c)=>s+(c.usd_jpy_rate-avgRate)*c.amount_usdc,0);
  const yForexUSD=_yConvs.reduce((s,c)=>s+(c.usd_jpy_rate>0?(c.usd_jpy_rate-avgRate)*c.amount_usdc/c.usd_jpy_rate:0),0);
  const taxable=Math.max(0,netJPY+yForex-totalExpJPY);
  const taxEst=Math.round(taxable*DB.taxRate/100);
  const pendingTxs=_yTxs.filter(t=>t.rate_status==="pending");
  const convAsTxs=_yConvs.map(c=>{
    const pnlJPY=(c.usd_jpy_rate-avgRate)*c.amount_usdc;
    const pnlUSD=c.usd_jpy_rate>0?pnlJPY/c.usd_jpy_rate:0;
    return {id:c.id,created_at:c.created_at,category:"為替損益",memo:c.memo?c.memo:(c.amount_usdc+" USDC"),
      profit_jpy:pnlJPY>=0?pnlJPY:0, loss_jpy:pnlJPY<0?-pnlJPY:0,
      profit_usd:pnlUSD>=0?pnlUSD:0, loss_usd:pnlUSD<0?-pnlUSD:0,
      usd_jpy_rate:c.usd_jpy_rate, currency_type:"USD", _isConv:true};
  });
  const allHistTxs=[..._yTxs,...convAsTxs];
  const allHistByMonth=allHistTxs.reduce((a,t)=>{const k=t.created_at.slice(0,7);(a[k]=a[k]||[]).push(t);return a;},{});
  const sortedMK=Object.keys(allHistByMonth).sort((a,b)=>b.localeCompare(a));

  const monthlyDataUSD=MONTHS.map((m,i)=>({month:m,v:allHistTxs.filter(t=>new Date(t.created_at).getMonth()===i).reduce((s,t)=>s+(t.profit_usd||0)-(t.loss_usd||0),0)}));
  const monthlyData=isUSD?monthlyDataUSD:monthlyDataJPY;
  // 経費のみ／実質損益（損益－経費）月別系列（円・USD両方）
  const expMonthlyJPY=MONTHS.map((m,i)=>_yExps.filter(e=>new Date(e.created_at).getMonth()===i).reduce((s,e)=>s+getExpJPY(e),0));
  const expMonthlyUSD=MONTHS.map((m,i)=>_yExps.filter(e=>new Date(e.created_at).getMonth()===i).reduce((s,e)=>s+getExpUSD(e),0));
  const chartSeries={
    pl:{JPY:monthlyDataJPY.map(m=>m.v),USD:monthlyDataUSD.map(m=>m.v)},
    ex:{JPY:expMonthlyJPY.map(v=>-v),USD:expMonthlyUSD.map(v=>-v)},
    net:{JPY:monthlyDataJPY.map((m,i)=>m.v-expMonthlyJPY[i]),USD:monthlyDataUSD.map((m,i)=>m.v-expMonthlyUSD[i])},
  };
  const allCatSet=new Set([...DB.txCats,...allHistTxs.map(t=>t.category)]);
  const catPnl=[...allCatSet].map(cat=>{
    const items=allHistTxs.filter(t=>t.category===cat);
    if(!items.length)return null;
    return {cat,netJPY:items.reduce((s,t)=>s+(t.profit_jpy||0)-(t.loss_jpy||0),0),netUSD:items.reduce((s,t)=>s+(t.profit_usd||0)-(t.loss_usd||0),0),count:items.length};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.netJPY)-Math.abs(a.netJPY));
  const corruptedExps=_yExps.filter(e=>e.currency_type==="USD"&&!e.amount_jpy&&!isValidRate(e.usd_jpy_rate)&&!e.amount_usd);
  const expByCat=_yExps.reduce((a,e)=>{(a[e.category]=a[e.category]||[]).push(e);return a;},{});

  const expByProj=_yExps.reduce((a,e)=>{const k=e.project||"（未設定）";(a[k]=a[k]||[]).push(e);return a;},{});

}

/* 日付ごとのレートキャッシュ付き取得 */
async function fetchCached(date){
  if(UI.rateCache[date])return UI.rateCache[date];
  const res=await getRateForDate(date);
  if(res){UI.rateCache[date]={rate:res.rate,src:res.src,fetchedAt:nowJST()};return UI.rateCache[date];}
  return null;
}
async function doFetchRate(date){
  if(UI.rateCache[date]){UI.fetchFailed=false;return UI.rateCache[date];}
  UI.fetching=true;render();
  const c=await fetchCached(date);
  UI.fetching=false;UI.fetchFailed=!c;render();
  return c;
}
async function resolveRate(date){
  if(UI.manualRate){const r=parseFloat(UI.manualRate);return r>0?{rate:r,src:"手動入力"}:null;}
  const c=await doFetchRate(date);
  return c?{rate:c.rate,src:c.src}:null;
}
function currentEntryDate(){return UI.entryTab==="tx"?UI.newTx.created_at:UI.entryTab==="exp"?UI.newExp.created_at:UI.newConv.created_at;}
function currentEntryRate(){
  const m=parseFloat(UI.manualRate); if(m>0)return m;
  const c=UI.rateCache[currentEntryDate()]; return c?c.rate:null;
}
/* 入力中の金額をもう一方の通貨で表示 */
function convText(cur,a,b,r){
  // cur: 入力通貨, a/b: 利益・損失 (または金額のみ a)
  const parts=[];
  if(cur==="USD"){
    if(a)parts.push(fmtJPY(Math.ceil(a*r*100)/100));
    if(b)parts.push("損失 "+fmtJPY(Math.floor(b*r*100)/100));
    return parts.length?"円換算 "+parts.join(" / ")+"（@¥"+r+"）":"";
  }
  if(a)parts.push(fmtUSD(r2(a/r)));
  if(b)parts.push("損失 "+fmtUSD(r2(b/r)));
  return parts.length?"ドル換算 "+parts.join(" / ")+"（@¥"+r+"）":"";
}
function previewText(){
  const r=currentEntryRate(); if(!r)return "";
  if(UI.entryTab==="tx"){const f=UI.newTx;
    return f.currency_type==="USD"?convText("USD",parseFloat(f.profit_usd)||0,parseFloat(f.loss_usd)||0,r):convText("JPY",parseFloat(f.profit_jpy)||0,parseFloat(f.loss_jpy)||0,r);}
  if(UI.entryTab==="exp"){const f=UI.newExp;
    return f.currency_type==="USD"?convText("USD",parseFloat(f.amount_usd)||0,0,r):convText("JPY",parseFloat(f.amount_jpy)||0,0,r);}
  return convText("USD",parseFloat(UI.newConv.amount_usdc)||0,0,r);
}

/* ============================================================
   既存データの補完：円入力でドル欄が空／ドル入力で円欄が空の行を、
   その日のレートで埋める（旧データ・レート未取得行の救済）
============================================================ */
let _backfilling=false;
function txFill(t,r,src){
  if(t.currency_type==="JPY"){t.profit_usd=r2((t.profit_jpy||0)/r);t.loss_usd=r2((t.loss_jpy||0)/r);}
  else{t.profit_jpy=Math.ceil((t.profit_usd||0)*r*100)/100;t.loss_jpy=Math.floor((t.loss_usd||0)*r*100)/100;}
  if(!isValidRate(t.usd_jpy_rate)){t.usd_jpy_rate=r;t.rate_source=src;}
  t.rate_status="ok";
}
function expFill(e,r,src){
  if(e.currency_type==="JPY")e.amount_usd=r2((e.amount_jpy||0)/r);
  else e.amount_jpy=Math.floor((e.amount_usd||0)*r*100)/100;
  if(!isValidRate(e.usd_jpy_rate)){e.usd_jpy_rate=r;e.rate_source=src;}
  e.rate_status="ok";
}
function txMissing(t){
  if(t.currency_type==="JPY")return (t.profit_jpy||t.loss_jpy)&&!(t.profit_usd||t.loss_usd);
  return (t.profit_usd||t.loss_usd)&&!(t.profit_jpy||t.loss_jpy);
}
function expMissing(e){
  if(e.currency_type==="JPY")return e.amount_jpy>0&&(e.amount_usd==null||e.amount_usd==="");
  return e.amount_usd>0&&!e.amount_jpy;
}
async function backfillRates(){
  if(_backfilling)return 0; _backfilling=true;
  let fixed=0;
  try{
    const needT=DB.txs.filter(txMissing), needE=DB.exps.filter(expMissing);
    // レートがある行はその場で換算
    needT.filter(t=>isValidRate(t.usd_jpy_rate)).forEach(t=>{txFill(t,t.usd_jpy_rate,t.rate_source);fixed++;});
    needE.filter(e=>isValidRate(e.usd_jpy_rate)).forEach(e=>{expFill(e,e.usd_jpy_rate,e.rate_source);fixed++;});
    // レートがない行は日付ごとに取得
    const restT=needT.filter(t=>!isValidRate(t.usd_jpy_rate)), restE=needE.filter(e=>!isValidRate(e.usd_jpy_rate));
    const dates=[...new Set([...restT,...restE].map(x=>x.created_at))].slice(0,60);
    for(const d of dates){
      const c=await fetchCached(d); if(!c)continue;
      restT.filter(t=>t.created_at===d).forEach(t=>{txFill(t,c.rate,c.src);fixed++;});
      restE.filter(e=>e.created_at===d).forEach(e=>{expFill(e,c.rate,c.src);fixed++;});
    }
  }finally{_backfilling=false;}
  if(fixed){saveDB();safeRender();toast("その日のレートで円・ドルを補完しました（"+fixed+"件）");}
  return fixed;
}
function isTyping(){const a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"));}

/* 編集時のレート決定：手動入力 > 既存レート(日付変更なし) > その日のレート取得 > 既存レート */
async function resolveEditRate(orig,f){
  const m=parseFloat(f.rate);
  if(f.rateTouched&&isValidRate(m))return {rate:m,src:m===orig.usd_jpy_rate?(orig.rate_source||RATE_SOURCE_NAME):"手動入力"};
  if(!f.rateTouched&&isValidRate(orig.usd_jpy_rate)&&(f.created_at===orig.created_at||orig.rate_source==="手動入力"))return {rate:orig.usd_jpy_rate,src:orig.rate_source||RATE_SOURCE_NAME};
  const c=await fetchCached(f.created_at);
  if(c)return {rate:c.rate,src:c.src};
  if(isValidRate(orig.usd_jpy_rate))return {rate:orig.usd_jpy_rate,src:orig.rate_source||RATE_SOURCE_NAME};
  return null;
}

    const byDate=a=>a.slice().reverse().sort((x,y)=>x.created_at<y.created_at?-1:x.created_at>y.created_at?1:0); // 古い順（同じ日は入力順）

      ["内容",csvQ("損益 "+DB.txs.length+"件・経費 "+DB.exps.length+"件・円転 "+DB.convs.length+"件・年次の手入力 "+Object.keys(DB.yearly).length+"年分・資産・現物計画・カテゴリ・設定")],

      ["## 設定"],["key","value"],["tax_rate",DB.taxRate],["dark_mode",DB.dark?1:0],[""],
      ["## カテゴリ設定"],["type","values"],
      ["tx_cats",DB.txCats.map(csvQ).join("|")],["tx_details",DB.txDetails.map(csvQ).join("|")],
      ["exp_cats",DB.expCats.map(csvQ).join("|")],["exp_projs",DB.expProjs.map(csvQ).join("|")],[""]];
    const yk=Object.keys(DB.yearly).sort();
    if(yk.length)L.push(["## 年次手入力"],["year","pl_jpy","exp_jpy","taxable_jpy","usd_jpy_rate","rate_source"],

function triggerImport(){document.getElementById("importFile").click();}
function handleImportFile(e){
  const file=e.target.files[0]; if(!file)return;
  if(file.size>5*1024*1024){UI.importMsg={ok:false,msg:"ファイルが大きすぎます（上限5MB）"};e.target.value="";render();return;}
  const reader=new FileReader();
  reader.onerror=()=>{UI.importMsg={ok:false,msg:"ファイルの読み込みに失敗しました"};e.target.value="";render();};
  reader.onload=ev=>{
    try{
      const res=parseCSVImport(ev.target.result);
      const yKeys=Object.keys(res.yearly);
      if(res.truncated){UI.importMsg={ok:false,msg:"行数が多すぎるため読み込みを中止しました"};render();return;}
      if(!res.txs.length&&!res.exps.length&&!res.convs.length&&!yKeys.length){UI.importMsg={ok:false,msg:"読み込めるデータが見つかりませんでした"};render();return;}
      if(res.meta.version>=2){UI.pendingRestore=res;openRestoreSheet();return;}
      // 前のアプリ・前の版の1年分CSV：今のデータに追加
      DB.txs=[...DB.txs,...res.txs]; DB.exps=[...DB.exps,...res.exps]; DB.convs=[...DB.convs,...res.convs];
      const cats=res.cats;
      if(cats.tx_cats&&cats.tx_cats.length)DB.txCats=[...new Set([...DB.txCats,...cats.tx_cats])];
      if(cats.tx_details&&cats.tx_details.length)DB.txDetails=[...new Set([...DB.txDetails,...cats.tx_details])];
      if(cats.exp_cats&&cats.exp_cats.length)DB.expCats=[...new Set([...DB.expCats,...cats.exp_cats])];
      if(cats.exp_projs&&cats.exp_projs.length)DB.expProjs=[...new Set([...DB.expProjs,...cats.exp_projs])];
      const catMsg=(cats.tx_cats||cats.tx_details||cats.exp_cats||cats.exp_projs)?"・カテゴリ設定を追加しました":"";
      yKeys.forEach(k=>{DB.yearly[k]=res.yearly[k];});
      const yMsg=yKeys.length?"・年次の手入力"+yKeys.length+"年分":"";
      saveDB();
      UI.importMsg={ok:true,msg:"✓ 損益"+res.txs.length+"件・経費"+res.exps.length+"件を追加しました"+catMsg+yMsg};
      render();
      backfillRates();
      backfillYearRates();
      setTimeout(()=>{UI.importMsg=null;render();},4000);
    }catch(err){UI.importMsg={ok:false,msg:"エラー: "+err.message};render();}
  };
  reader.readAsText(file,"utf-8"); e.target.value="";
}

function doRestore(){
  const r=UI.pendingRestore; if(!r)return;
  DB.txs=r.txs.slice().reverse(); DB.exps=r.exps.slice().reverse(); DB.convs=r.convs.slice().reverse();
  DB.yearly=r.yearly;
  if(r.pf)DB.pf=r.pf; if(r.plan)DB.plan=r.plan;
  if(r.cats.tx_cats)DB.txCats=r.cats.tx_cats; if(r.cats.tx_details)DB.txDetails=r.cats.tx_details;
  if(r.cats.exp_cats)DB.expCats=r.cats.exp_cats; if(r.cats.exp_projs)DB.expProjs=r.cats.exp_projs;
  const tr=parseFloat(r.settings.tax_rate); if(tr>0&&tr<=100)DB.taxRate=tr;
  if(r.settings.dark_mode==="1"||r.settings.dark_mode==="0")DB.dark=r.settings.dark_mode==="1";
  saveDB(); applyTheme(); closeSheet();
  UI.importMsg={ok:true,msg:"✓ 復元しました（損益"+DB.txs.length+"件・経費"+DB.exps.length+"件・円転"+DB.convs.length+"件・年次の手入力"+Object.keys(DB.yearly).length+"年分・カテゴリ・設定）"};
  render(); toast("バックアップから復元しました");
  backfillRates(); backfillYearRates();
  setTimeout(()=>{UI.importMsg=null;render();},5000);
}

/* 目盛り：きりのいい数字（25万・50万…）で、ラベルが重ならないものだけ表示 */
function niceStep(raw){
  if(!(raw>0))return 1;
  const p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; let best=1;
  [1,2,2.5,5,10].forEach(x=>{if(Math.abs(Math.log(x/f))<Math.abs(Math.log(best/f)))best=x;});
  return best*p;
}
function niceScale(minV,maxV){
  const lo0=Math.min(0,minV), hi0=Math.max(0,maxV);
  if(!(hi0-lo0>0))return {lo:0,hi:1,ticks:[0]};
  const step=niceStep((hi0-lo0)/4);
  const hi=Math.ceil(hi0/step-1e-9)*step, lo=Math.floor(lo0/step+1e-9)*step, ticks=[];
  for(let k=Math.round(lo/step);k<=Math.round(hi/step);k++)ticks.push(k*step);
  return {lo,hi,ticks};
}
function axisFmt(ticks,isUSD){
  const big=ticks.some(t=>Math.abs(t)>=10000), r1=x=>String(Math.round(x*10)/10);
  return v=>{
    const sg=v<0?"-":"", a=Math.abs(v);
    if(!big)return sg+a.toLocaleString("en-US",{maximumFractionDigits:2});
    if(isUSD)return sg+(a>=1e6?r1(a/1e6)+"M":r1(a/1e3)+"K");
    return sg+(a>=1e8?r1(a/1e8)+"億":r1(a/1e4)+"万");
  };
}
function axisHTML(sc,H,fmt){
  const span=sc.hi-sc.lo, yOf=v=>Math.round((sc.hi-v)/span*H), zy=yOf(0), shown=[zy];
  let lab='<div class="ytick" style="top:'+zy+'px">0</div>', grid="";
  sc.ticks.forEach(t=>{
    const y=yOf(t);
    grid+='<div class="grid'+(t===0?" zero":"")+'" style="top:'+y+'px"></div>';
    if(t!==0&&shown.every(s=>Math.abs(s-y)>=15)){shown.push(y);lab+='<div class="ytick" style="top:'+y+'px">'+fmt(t)+"</div>";}
  });
  return '<div class="yax">'+lab+"</div>"+grid;
}
function barPair(val,H,span,posH,negH,color,tag){
  const ph=val>0?Math.max(2,Math.round(H*val/span)):0, nh=val<0?Math.max(2,Math.round(H*(-val)/span)):0, t=tag||"div";
  return '<'+t+' class="pos" style="height:'+posH+'px">'+(ph?'<i class="bar up" style="height:'+ph+"px;background:"+color+'"></i>':"")+"</"+t+">"+
         '<'+t+' class="neg" style="height:'+negH+'px">'+(nh?'<i class="bar dn" style="height:'+nh+"px;background:"+color+'"></i>':"")+"</"+t+">";
}

function chartHTML(series,isUSD,mode,otherSeries,cfg){
  cfg=cfg||{};
  const labels=cfg.labels||MONTHS, key=cfg.selKey||"chartSel", title=cfg.title||(i=>(i+1)+"月");
  const H=130, v=series;
  const sc=niceScale(Math.min(0,...v),Math.max(0,...v)), span=sc.hi-sc.lo;
  const posH=Math.round(H*sc.hi/span), negH=H-posH;
  let h=axisHTML(sc,H,axisFmt(sc.ticks,isUSD));
  h+='<div class="bars">';
  v.forEach((val,i)=>{
    const col=mode==="ex"?"var(--m-exp)":mode==="tax"?"var(--m-tax)":(val<0?"var(--m-loss)":"var(--m-pl)");
    h+='<div class="col" onclick="UI.'+key+'=(UI.'+key+'==='+i+'?-1:'+i+');render()">'+barPair(val,H,span,posH,negH,col)+"</div>";
  });
  h+="</div>";
  const sel=UI[key];
  if(sel>=0&&sel<v.length){
    const val=v[sel], dispVal=mode==="ex"?-val:val, missing=cfg.nulls&&cfg.nulls[sel];
    const tcol=mode==="ex"?"var(--orange)":mode==="tax"?"var(--violet)":(val<0?"var(--red)":"var(--green)");
    const lx=Math.min(83,Math.max(17,(sel+0.5)/v.length*100));
    const ovRaw=otherSeries?otherSeries[sel]:null, ov=ovRaw==null?null:(mode==="ex"?-ovRaw:ovRaw);
    h+='<div class="tip" style="left:'+lx+'%;transform:translateX(-50%)"><b>'+title(sel)+"</b>"+
       (missing?'<s class="num" style="color:var(--sub)">レート未取得</s>':'<s class="num" style="color:'+tcol+'">'+(isUSD?fmtUSD(dispVal):fmtJPY(dispVal))+"</s>")+
       (ov!=null?'<i class="num">'+(isUSD?fmtJPY(ov):fmtUSD(ov))+"</i>":"")+"</div>";
  }
  h+='<div class="xax">'+labels.map(l=>"<span>"+esc(l)+"</span>").join("")+"</div>";
  return h;
}

function updateYearPreview(){

function saveYear(){
  const f=UI.editYear; if(!f)return;
  const fail=m=>{f.err=m;const el=document.getElementById("yearErr");if(el)el.textContent=m;};
  const ys=String(f.year).trim(), y=parseInt(ys,10);
  if(!/^\d{4}$/.test(ys)||y<2000||y>2100)return fail("年を4桁で入れてください（例：2024）");
  if(f.pl===""&&f.exp==="")return fail("損益か経費を入れてください");
  if([f.pl,f.exp].filter(v=>v!=="").map(Number).some(n=>!isFinite(n)||n<0||n>1e12))return fail("金額は0以上の数字で入れてください");
  if(DB.yearly[y]&&ys!==f.orig)return fail(y+"年はすでに手入力済みです。一覧からタップして編集してください");
  const rv=String(f.rate||"").trim(); let rate=null, rateSrc="";
  if(rv!==""){const n=Number(rv); if(!isValidRate(n))return fail("レートは50〜300の数字で入れてください（空欄なら自動）"); rate=n; rateSrc=f.rateTouched?"手動入力":(f.rateSrc||"手動入力");}
  if(f.orig&&f.orig!==ys&&!f.rateTouched&&rateSrc!=="手動入力"){rate=null;rateSrc="";}
  if(f.orig&&f.orig!==ys)delete DB.yearly[f.orig];
  DB.yearly[y]={pl:(Number(f.pl)||0)*(f.sign==="loss"?-1:1),exp:Number(f.exp)||0,taxable:f.taxable===""?null:Number(f.taxable),rate,rateSrc};
  saveDB();closeSheet();render();toast(y+"年の結果を保存しました");
  backfillYearRates();
}
let _yrBusy=false,_yrAgain=false;
async function backfillYearRates(){
  if(_yrBusy){_yrAgain=true;return;}
  _yrBusy=true;
  try{
    do{
      _yrAgain=false;
      const need=Object.keys(DB.yearly).filter(k=>DB.yearly[k]&&!isValidRate(DB.yearly[k].rate));
      if(!need.length)break;
      UI.yearRateFetching=true;safeRender();
      let n=0;
      for(const k of need){
        const m=DB.yearly[k], r=await getYearAvgRate(+k);
        if(r&&DB.yearly[k]===m&&!isValidRate(m.rate)){m.rate=r;m.rateSrc=YEAR_RATE_SRC;n++;}
      }
      if(n)saveDB();
    }while(_yrAgain);
  }finally{_yrBusy=false;UI.yearRateFetching=false;}
  safeRender();
}
function deleteYear(y){delete DB.yearly[y];saveDB();closeSheet();render();toast(y+"年の手入力を削除しました");}

const PRICE_API="https://api.coingecko.com/api/v3/simple/price?ids="+PF_ASSETS.filter(a=>a.id).map(a=>a.id).join(",")+"&vs_currencies=usd,jpy";
const PRICE_TTL=5*60*1000;
function pfDefault(){return {BTC:0,ETH:0,HYPE:0,NEAR:0,USDC:0,JPY:0};}
let PRICES=null;
try{const pc=JSON.parse(localStorage.getItem("cl_prices")||"null");if(pc&&pc.at&&pc.data)PRICES=pc;}catch(e){}
async function refreshPrices(force){
  if(UI.priceBusy)return;
  const age=PRICES?Date.now()-PRICES.at:Infinity;
  if(force&&age<30000){toast("最新の価格です");return;}
  if(!force&&age<PRICE_TTL)return;
  UI.priceBusy=true;safeRender();
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),10000);
    const res=await fetch(PRICE_API,{signal:ctrl.signal}); clearTimeout(timer);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const d=await res.json(), data={};
    PF_ASSETS.forEach(a=>{const q=a.id&&d&&d[a.id]; if(q&&q.usd>0&&q.jpy>0)data[a.k]={usd:+q.usd,jpy:+q.jpy};});
    if(!Object.keys(data).length)throw new Error("empty");
    PRICES={at:Date.now(),data:Object.assign({},PRICES?PRICES.data:{},data)}; UI.priceErr=false;
    try{localStorage.setItem("cl_prices",JSON.stringify(PRICES));}catch(e){}
  }catch(e){UI.priceErr=true;console.warn("CoinGecko:",e.message);}
  finally{UI.priceBusy=false;}
  safeRender();
}
function usdJpy(){
  const u=PRICES&&PRICES.data.USDC; if(u)return u.jpy/u.usd;

}
function priceOf(k,cur){ // 1単位の価格（cur: USD / JPY）
  const fx=usdJpy();
  if(k==="JPY")return cur==="JPY"?1:(fx?1/fx:null);
  if(k==="USDC")return cur==="USD"?1:fx;
  const q=PRICES&&PRICES.data[k];
  return q?(cur==="USD"?q.usd:q.jpy):null;
}
function fmtCur(v,cur){return v==null?"—":(cur==="USD"?fmtUSD(v):fmtJPYFloor(v));}
function fmtQty(q){return (+q).toLocaleString("en-US",{maximumFractionDigits:8});}

/* 現物の計画：予算・投資済み（保有分込み）・1回の買付額から、残り・あと何発・いつまでを出す */
function ymNow(){return todayStr().slice(0,7);}
function addYM(ym,k){const y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;return (y+Math.floor(m/12))+"-"+String(((m%12)+12)%12+1).padStart(2,"0");}
function ymLabel(ym){return (+ym.slice(0,4))+"年"+(+ym.slice(5,7))+"月";}
function planCalc(p){
  const budget=+p.budget||0, inv=+p.invested||0, lot=+p.lot||0, rem=Math.max(0,budget-inv);
  const n=lot>0&&rem>0?Math.ceil(rem/lot-1e-9):0;
  return {budget,inv,lot,rem,pct:budget>0?Math.min(1,inv/budget):0,n,end:n>0?addYM(ymNow(),n-1):null};
}
function fmtPlan(v,cur){return cur==="JPY"?fmtJPYFloor(v):"$"+Math.round(v).toLocaleString("en-US");}
function meterHTML(pct){
  const p=Math.max(0,Math.min(1,pct||0))*100;
  return '<span class="mbar" role="img" aria-label="投資済み '+Math.round(p)+'%">'+(p>0?'<i style="flex:0 0 calc('+p.toFixed(2)+"% - "+(p<100?1:0)+'px)"></i>':"")+(p<100?"<b></b>":"")+"</span>";
}
function planCardHTML(){
  const items=PLAN_COINS.map(k=>DB.plan.find(x=>x.sym===k)).filter(Boolean);
  let h='<div class="card"><p class="mid" style="margin:0">現物の計画</p><p class="hint" style="margin:2px 0 6px">残金と進捗（保有分込み）</p>';
  if(!items.length)h+='<p class="hint" style="margin:6px 0 0">銘柄ごとに予算・もう投資した額・1回の買付額を入れると、残りとあと何回で終わるかを出します。</p>';
  items.forEach(x=>{
    const c=planCalc(x);
    const meta=c.budget<=0?"予算が未設定です":c.rem<=0?"予算を使い切りました":
      "残り "+fmtPlan(c.rem,x.cur)+(c.lot?"・あと"+c.n+"発・"+ymLabel(c.end)+"まで":"");
    h+='<button type="button" class="prow" onclick="openPlanSheet(\''+x.sym+'\')"><span class="top"><span class="nm">'+x.sym+"（"+(x.cur==="JPY"?"日本円":"USDC")+'）</span><span class="pc">'+Math.round(c.pct*100)+"%</span></span>"+
       '<span class="meta">'+meta+"</span>"+meterHTML(c.pct)+"</button>";
  });
  if(items.length>1){
    const cur=UI.dispCur, fx=usdJpy();
    const cv=(v,from)=>{const same=(cur==="JPY")===(from==="JPY");if(same)return v;if(!fx)return null;return cur==="JPY"?v*fx:v/fx;};
    let b=0,iv=0,rm=0,ok=true;
    items.forEach(x=>{const c=planCalc(x),B=cv(c.budget,x.cur),I=cv(Math.min(c.inv,c.budget),x.cur),M=cv(c.rem,x.cur);if(B==null){ok=false;return;}b+=B;iv+=I;rm+=M;});
    const pct=ok&&b>0?iv/b:0;
    h+='<div class="prow"><span class="top"><span class="nm">合計（'+(cur==="JPY"?"円換算":"ドル換算")+'）</span><span class="pc">'+(ok?Math.round(pct*100)+"%":"—")+"</span></span>"+
       '<span class="meta">'+(ok?"残り "+fmtPlan(rm,cur==="JPY"?"JPY":"USDC"):"為替レートを取得すると表示します")+"</span>"+meterHTML(pct)+"</div>";
  }
  if(items.length)h+='<div class="pleg"><span><i class="sw" style="background:var(--m-inv)"></i>投資済み</span><span><i class="sw" style="background:var(--m-track)"></i>残り</span></div>'+
     '<p class="hint" style="margin-top:6px">毎月1回の買付で計算・行をタップで編集</p>';
  if(items.length<PLAN_COINS.length)h+='<button type="button" class="linkbtn" onclick="openPlanSheet()">＋ 計画を追加</button>';
  return h+"</div>";
}

    h+='<div class="f"><div class="lbl">'+l+'</div><input type="number" inputmode="decimal" placeholder="0" value="'+esc(f[k])+'" oninput="UI.editPlan.'+k+'=this.value;updatePlanPreview()"></div>';
  });

  h+='<button class="savebtn" onclick="savePlan()">保存する</button>';
  if(f.orig)h+='<button class="savebtn" style="background:transparent;color:#f43f5e;margin-top:8px;border:1px solid rgba(244,63,94,.4)" onclick="deletePlan(\''+f.orig+'\')">この計画を削除</button>';

}
function updatePlanPreview(){
  const el=document.getElementById("planPreview"), f=UI.editPlan; if(!el||!f)return;
  if(!(+f.budget>0)){el.textContent="";return;}
  const c=planCalc({budget:f.budget,invested:f.invested,lot:f.lot});
  el.textContent=Math.round(c.pct*100)+"%・"+(c.rem<=0?"予算を使い切っています":"残り "+fmtPlan(c.rem,f.cur)+(c.n?"・あと"+c.n+"発・"+ymLabel(c.end)+"まで":""));
}
function savePlan(){
  const f=UI.editPlan; if(!f)return;
  const fail=m=>{f.err=m;const el=document.getElementById("planErr");if(el)el.textContent=m;};
  const nums={};
  for(const k of ["budget","invested","lot"]){const v=String(f[k]||"").trim();const n=v===""?0:Number(v);if(!isFinite(n)||n<0||n>1e15)return fail("金額は0以上の数字で入れてください");nums[k]=n;}
  if(!(nums.budget>0))return fail("予算を入れてください");
  if(!PLAN_COINS.includes(f.sym))return fail("銘柄を選んでください");
  DB.plan=DB.plan.filter(q=>q.sym!==f.orig&&q.sym!==f.sym);
  DB.plan.push({sym:f.sym,cur:f.cur==="JPY"?"JPY":"USDC",budget:nums.budget,invested:nums.invested,lot:nums.lot});
  saveDB();closeSheet();render();toast("保存しました");
}
function deletePlan(sym){DB.plan=DB.plan.filter(q=>q.sym!==sym);saveDB();closeSheet();render();toast("削除しました");}

  if(!UI.confirmDelete)h+='<button class="savebtn" style="background:transparent;border:1px solid rgba(244,63,94,.5);color:var(--red)" onclick="UI.confirmDelete=true;render()">全データを削除する</button>';
  else h+='<div style="background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.4);border-radius:12px;padding:12px">'+
     '<p class="r" style="text-align:center;font-weight:700;font-size:14.5px;margin:0 0 6px">⚠️ 本当に削除しますか？</p>'+
     '<p class="hint" style="text-align:center;margin-bottom:10px">損益 '+DB.txs.length+"件・経費 "+DB.exps.length+"件・円転 "+DB.convs.length+"件・年次の手入力 "+Object.keys(DB.yearly).length+'年分・資産と現物計画がすべて削除されます</p>'+
     '<div class="row2"><button class="savebtn" style="background:var(--card2)" onclick="UI.confirmDelete=false;render()">キャンセル</button>'+
     '<button class="savebtn" style="background:var(--red)" onclick="handleDeleteAll()">削除する</button></div></div>';
  h+="</div>";

  h+='<div class="card tight"><div class="between" style="padding:14px 16px"><span style="font-size:15px;font-weight:600">ダークモード</span>'+
     '<button class="dot '+(DB.dark?"on":"")+'" style="width:44px;height:24px;border-radius:99px" onclick="toggleDark()"><i style="width:18px;height:18px;top:3px;left:3px;position:absolute;border-radius:50%;background:#fff;transition:transform .15s;'+(DB.dark?"transform:translateX(20px)":"")+'"></i></button></div></div>';

  h+='<div style="text-align:center;padding:10px 0;color:var(--sub)"><p style="font-size:12.5px;margin:2px">📒損益台帳 Ver 1.00</p>'+
     '<p style="font-size:12.5px;margin:2px">開発: <a href="https://x.com/babucrypter" target="_blank" rel="noopener noreferrer">𝕏 @babucrypter</a></p></div>';
  h+="</div>";
  document.getElementById("v-settings").innerHTML=h;
}

/* ============================================================
   マスターレンダー
============================================================ */
function render(){
  document.getElementById("yLbl").textContent=UI.year+"年";
  document.querySelectorAll("main").forEach(m=>m.classList.toggle("on",m.id==="v-"+UI.tab));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===UI.tab));
  if(UI.tab==="home")renderHome();
  else if(UI.tab==="tax")renderTax();
  else renderSettings();
}

/* ============================================================
   起動
============================================================ */
loadDB();
applyTheme();
render();
backfillRates();
backfillYearRates();
refreshPrices(false);
if(typeof setInterval==="function")setInterval(()=>{if(document.visibilityState!=="hidden")refreshPrices(false);},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshPrices(false);});
</script>
</body>
</html>
